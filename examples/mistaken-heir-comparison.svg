    <text x="30" y="419" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172b43">The case facts</text><text font-family="sans-serif" font-size="16" fill="#172b43"><tspan x="30" y="445">Lucius owns a silver cup. Marcus steals it. Marcus sells and delivers the cup to</tspan><tspan x="30" y="467">Aulus, who believes Marcus owns it when he receives it.</tspan></text>
    <text x="30" y="494" font-family="sans-serif" font-size="15" fill="#172b43">Gaius 2.43; 2.45; 2.42. Valid sale and uninterrupted possession assumed.</text>
