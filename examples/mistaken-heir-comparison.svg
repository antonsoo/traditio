<svg xmlns="http://www.w3.org/2000/svg" width="800" height="529" viewBox="0 0 800 529" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc">
    <title id="diagram-title">silver cup: 1 completed year</title>
    <desc id="diagram-desc">Lucius owns a silver cup. Marcus steals it. Marcus sells and delivers the cup to Aulus, who believes Marcus owns it when he receives it. Time cannot cure this defect. A stolen cup cannot be acquired by this usucapion, even by an innocent buyer. The source blocks the route; it does not merely ask for a longer wait. Gaius 2.43; 2.45; 2.42. This case assumes capable citizens, a valid sale and uninterrupted possession.</desc>
