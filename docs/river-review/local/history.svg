<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-labelledby="river-title river-desc"><title id="river-title">A piece torn away · Aulus</title><desc id="river-desc">A piece torn away. Investigation: A piece torn away. Reading: Digest · excerpts attributed to Gaius. Point in history: 3 of 3 recorded attempts. At Aulus’s bank: Yes. Roots in Aulus’s soil: Established. Long attachment there: Established. Floodwater: Not part of this case. Ownership of the focus: Aulus. Last express / stipulated owner: Aulus. Digest 41.1.7.2 adds long attachment and roots in the receiving estate, then says ex eo tempore: from that time. Both facts are now established. No fixed year count is supplied. Schematic, not a surveyed boundary or a hydraulic simulation.</desc><defs><marker id="river-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#526478"/></marker></defs><rect width="700" height="390" fill="#edf2f6"/><g font-family="'Source Sans 3',sans-serif" font-size="18" fill="#172b43"><path d="M35 95H301Q324 175 307 260L316 330H35Z" fill="#dce6df"/><path d="M395 95H665V330H399Q377 240 399 170Z" fill="#dce6df"/><path d="M301 95Q324 175 307 260L316 330H399Q377 240 399 170L395 95Z" fill="#c2dae7"/><path d="M301 95Q324 175 307 260L316 330M395 95L399 170Q377 240 399 330" stroke="#286491" stroke-width="1.5" fill="none"/><text x="55" y="61" font-size="22">Lucius</text><text x="646" y="61" text-anchor="end" font-size="22">Aulus</text><text x="55" y="83" fill="#526478" font-size="16">left estate</text><text x="646" y="83" text-anchor="end" fill="#526478" font-size="16">receiving estate</text><path d="M351 117V149" stroke="#286491" stroke-width="1.5" marker-end="url(#river-arrow)"/><path d="M235 165H306V270H235" fill="#d8e5ec" stroke="#705181" stroke-dasharray="5 5"/><path d="M288 207C337 167 357 166 396 200" stroke="#526478" fill="none" stroke-width="1.5" marker-end="url(#river-arrow)"/><g><path d="M392 175L462 165V270L391 260Z" fill="#e3dbc8" stroke="#276457" stroke-width="3"/><g transform="translate(426 220)"><path d="M0 0V-44M0-18L-19-34M0-25L17-42" fill="none" stroke="#172b43" stroke-width="3"/><path d="M-31-42Q-34-64-15-65Q-7-85 10-69Q35-71 31-48Q29-31 8-34Q-13-22-31-42Z" fill="#b1c9b9" stroke="#276457" stroke-width="1.5"/><path d="M0 0Q-14 12-23 16M0 0Q7 12 25 19" fill="none" stroke="#80601c" stroke-width="2"/><path d="M0 0Q24 13 45 15T73 29M45 15L51 30M65 24L74 18" fill="none" stroke="#276457" stroke-width="2.5"/></g><path d="M462 177L476 187M462 203L476 213M462 229L476 239M462 255L476 265" stroke="#80601c" stroke-width="3"/></g><text x="427" y="303" text-anchor="middle" font-weight="600" fill="#276457">Aulus’s piece</text><text x="35" y="365" fill="#526478" font-size="16">Schematic · ownership is a separate fact</text></g></svg>